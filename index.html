<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nebula — AI Chat</title>

<style>
:root{
  --bg:#f7f7fa;
  --panel:#ffffff;
  --panel2:#f0f1f5;
  --text:#17181d;
  --muted:#777b87;
  --border:#e4e5ea;
  --accent:#635bff;
  --user:#eeeaff;
  --shadow:0 18px 55px rgba(30,35,60,.08);
}

.dark{
  --bg:#0b0d12;
  --panel:#12151c;
  --panel2:#191d26;
  --text:#f4f5f7;
  --muted:#969cab;
  --border:#292e39;
  --accent:#8b7cff;
  --user:#211d35;
  --shadow:0 18px 55px rgba(0,0,0,.25);
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  overflow:hidden;
}

button,input,textarea{font:inherit}

.app{
  display:flex;
  height:100vh;
}

/* SIDEBAR */

.sidebar{
  width:270px;
  background:var(--panel);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  padding:16px;
  transition:.25s;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  font-weight:800;
  font-size:19px;
  padding:7px 8px 20px;
}

.logo{
  width:34px;
  height:34px;
  border-radius:11px;
  background:linear-gradient(135deg,#635bff,#9a75ff);
  display:grid;
  place-items:center;
  color:white;
  font-size:18px;
  box-shadow:0 8px 25px rgba(99,91,255,.25);
}

.newchat{
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--text);
  padding:11px 13px;
  border-radius:12px;
  cursor:pointer;
  text-align:left;
}

.newchat:hover,
.sidebtn:hover{
  background:var(--panel2);
}

.side-title{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.12em;
  color:var(--muted);
  padding:23px 8px 9px;
}

.history{
  overflow:auto;
  flex:1;
}

.chatitem{
  padding:10px 11px;
  border-radius:10px;
  color:var(--muted);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  cursor:pointer;
  margin-bottom:3px;
}

.chatitem.active,
.chatitem:hover{
  background:var(--panel2);
  color:var(--text);
}

.sidebottom{
  border-top:1px solid var(--border);
  padding-top:12px;
}

.sidebtn{
  width:100%;
  border:0;
  background:transparent;
  color:var(--text);
  padding:10px;
  border-radius:10px;
  text-align:left;
  cursor:pointer;
}

/* MAIN */

.main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:64px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  background:var(--panel);
}

.model{
  font-weight:700;
}

.status{
  font-size:12px;
  color:var(--muted);
  margin-top:2px;
}

.iconbtn{
  width:38px;
  height:38px;
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--text);
  border-radius:10px;
  cursor:pointer;
}

.messages{
  flex:1;
  overflow:auto;
  padding:34px 18px 130px;
}

.wrap{
  max-width:850px;
  margin:auto;
}

.hero{
  text-align:center;
  padding:10vh 10px 35px;
}

.hero h1{
  font-size:clamp(32px,6vw,54px);
  margin:0 0 10px;
  letter-spacing:-.04em;
}

.hero p{
  color:var(--muted);
  margin:0;
}

/* MESSAGES */

.msg{
  display:flex;
  gap:12px;
  margin:0 auto 25px;
  max-width:850px;
}

.avatar{
  width:32px;
  height:32px;
  min-width:32px;
  border-radius:10px;
  display:grid;
  place-items:center;
  background:var(--panel2);
  font-size:13px;
  font-weight:700;
}

.msg.user .avatar{
  background:var(--accent);
  color:white;
}

.bubble{
  line-height:1.65;
  max-width:calc(100% - 45px);
  white-space:pre-wrap;
}

.msg.user .bubble{
  background:var(--user);
  padding:11px 15px;
  border-radius:15px 15px 4px 15px;
}

.msg.ai .bubble{
  padding-top:3px;
}

/* COMPOSER */

.composer{
  position:fixed;
  bottom:0;
  left:270px;
  right:0;
  padding:15px 18px 20px;
  background:linear-gradient(transparent,var(--bg) 25%);
}

.composebox{
  max-width:850px;
  margin:auto;
  background:var(--panel);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  border-radius:18px;
  padding:10px;
  display:flex;
  gap:8px;
  align-items:flex-end;
}

textarea{
  resize:none;
  flex:1;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  padding:10px;
  min-height:42px;
  max-height:150px;
}

.send{
  width:42px;
  height:42px;
  border:0;
  border-radius:12px;
  background:var(--accent);
  color:#fff;
  cursor:pointer;
  font-size:18px;
}

.send:disabled{
  opacity:.45;
}

.hint{
  max-width:850px;
  margin:7px auto 0;
  text-align:center;
  font-size:11px;
  color:var(--muted);
}

.menu{
  display:none;
}

/* MOBILE */

@media(max-width:700px){

  .sidebar{
    position:fixed;
    z-index:5;
    left:-280px;
    top:0;
    bottom:0;
  }

  .sidebar.open{
    left:0;
    box-shadow:20px 0 50px rgba(0,0,0,.2);
  }

  .composer{
    left:0;
  }

  .topbar{
    padding:0 12px;
  }

  .messages{
    padding-left:12px;
    padding-right:12px;
  }

  .hero{
    padding-top:8vh;
  }

  .menu{
    display:block;
  }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar" id="sidebar">

  <div class="brand">
    <div class="logo">✦</div>
    Nebula
  </div>

  <button class="newchat" onclick="newChat()">
    ＋ New chat
  </button>

  <div class="side-title">
    Conversations
  </div>

  <div class="history" id="history"></div>

  <div class="sidebottom">

    <button class="sidebtn" onclick="toggleTheme()">
      ☾ &nbsp; Toggle appearance
    </button>

    <button class="sidebtn" onclick="clearChats()">
      ⌫ &nbsp; Clear conversations
    </button>

  </div>

</aside>


<main class="main">

<header class="topbar">

  <div style="display:flex;align-items:center;gap:10px">

    <button class="iconbtn menu" onclick="toggleSidebar()">
      ☰
    </button>

    <div>
      <div class="model">Nebula AI</div>
      <div class="status">Ready to chat</div>
    </div>

  </div>

  <button class="iconbtn" onclick="toggleTheme()">
    ☼
  </button>

</header>


<section class="messages" id="messages">

  <div class="wrap" id="messageWrap">

    <div class="hero">

      <h1>What can I help with?</h1>

      <p>
        Ask Nebula anything. Your AI workspace starts here.
      </p>

    </div>

  </div>

</section>


<div class="composer">

  <div class="composebox">

    <textarea
      id="input"
      rows="1"
      placeholder="Message Nebula..."
      oninput="resizeBox(this)"
      onkeydown="keySend(event)"
    ></textarea>

    <button
      class="send"
      id="send"
      onclick="sendMessage()"
    >
      ↑
    </button>

  </div>

  <div class="hint">
    Nebula is currently running in demo mode. A secure AI backend can be connected next.
  </div>

</div>

</main>

</div>


<script>

const KEY = "nebula_chats_v2";
const THEME = "nebula_theme";

let chats = JSON.parse(localStorage.getItem(KEY) || "[]");

let current =
  chats[0]?.id ||
  Date.now().toString();


function save(){

  localStorage.setItem(
    KEY,
    JSON.stringify(chats)
  );

}


function currentChat(){

  let c = chats.find(
    x => x.id === current
  );

  if(!c){

    c = {
      id:current,
      title:"New chat",
      messages:[]
    };

    chats.unshift(c);

    save();

  }

  return c;

}


function renderHistory(){

  const h =
    document.getElementById("history");

  h.innerHTML =
    chats.map(c => `

      <div
        class="chatitem ${c.id===current?"active":""}"
        onclick="openChat('${c.id}')"
      >

        ${esc(c.title)}

      </div>

    `).join("");

}


function renderMessages(){

  const wrap =
    document.getElementById("messageWrap");

  const c =
    currentChat();

  wrap.innerHTML = "";

  if(!c.messages.length){

    wrap.innerHTML = `

      <div class="hero">

        <h1>What can I help with?</h1>

        <p>
          Ask Nebula anything. Your AI workspace starts here.
        </p>

      </div>

    `;

  }
  else{

    c.messages.forEach(
      m => addMessage(
        m.role,
        m.text,
        false
      )
    );

  }

  scrollBottom();

  renderHistory();

}


function addMessage(
  role,
  text,
  scroll=true
){

  const wrap =
    document.getElementById(
      "messageWrap"
    );

  const row =
    document.createElement("div");

  row.className =
    "msg " + role;

  row.innerHTML = `

    <div class="avatar">
      ${role==="user" ? "You" : "✦"}
    </div>

    <div class="bubble">
      ${format(text)}
    </div>

  `;

  wrap.appendChild(row);

  if(scroll)
    scrollBottom();

}


function format(t){

  return esc(t)
    .replace(
      /```([\s\S]*?)```/g,
      '<pre style="background:var(--panel2);padding:12px;border-radius:10px;overflow:auto">$1</pre>'
    )
    .replace(
      /\*\*(.*?)\*\*/g,
      "<strong>$1</strong>"
    )
    .replace(
      /\n/g,
      "<br>"
    );

}


function esc(t){

  return String(t).replace(
    /[&<>"']/g,
    s => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[s])
  );

}


function scrollBottom(){

  const m =
    document.getElementById(
      "messages"
    );

  m.scrollTop =
    m.scrollHeight;

}


function resizeBox(el){

  el.style.height="auto";

  el.style.height =
    Math.min(
      el.scrollHeight,
      150
    ) + "px";

}


function keySend(e){

  if(
    e.key==="Enter" &&
    !e.shiftKey
  ){

    e.preventDefault();

    sendMessage();

  }

}


function newChat(){

  current =
    Date.now().toString();

  chats.unshift({

    id:current,

    title:"New chat",

    messages:[]

  });

  save();

  renderMessages();

  document
    .getElementById("input")
    .focus();

}


function openChat(id){

  current=id;

  renderMessages();

  if(innerWidth<700)
    toggleSidebar();

}


function clearChats(){

  if(
    confirm(
      "Clear all saved conversations?"
    )
  ){

    chats=[];

    newChat();

  }

}


function toggleTheme(){

  document.body
    .classList
    .toggle("dark");

  localStorage.setItem(
    THEME,
    document.body.classList.contains("dark")
      ? "dark"
      : "light"
  );

}


function toggleSidebar(){

  document
    .getElementById("sidebar")
    .classList
    .toggle("open");

}


async function sendMessage(){

  const input =
    document.getElementById(
      "input"
    );

  const text =
    input.value.trim();

  const btn =
    document.getElementById(
      "send"
    );

  if(!text || btn.disabled)
    return;

  const c =
    currentChat();

  if(!c.messages.length){

    c.title =
      text.slice(0,34) +
      (text.length>34 ? "…" : "");

  }

  c.messages.push({
    role:"user",
    text:text
  });

  save();

  renderMessages();

  input.value="";

  resizeBox(input);

  btn.disabled=true;


  /*
    DEMO RESPONSE

    This is where the secure AI backend
    will eventually be connected.
  */

  await new Promise(
    r => setTimeout(r,650)
  );


  const reply =
    demoReply(text);

  c.messages.push({
    role:"ai",
    text:reply
  });

  save();

  addMessage(
    "ai",
    reply
  );

  btn.disabled=false;

  input.focus();

  renderHistory();

}


function demoReply(t){

  const q =
    t.toLowerCase();


  if(
    q.includes("hello") ||
    q.includes("hi ")
  ){

    return `
Hello! I'm Nebula.

The interface is ready. The next step is connecting a secure AI backend so I can generate real AI responses.
`;

  }


  if(
    q.includes("who are you")
  ){

    return `
I'm Nebula, your AI-chat interface.

Right now I'm running in demo mode. Once the backend is connected, I'll be able to send your prompts to a real AI model.
`;

  }


  if(
    q.includes("code") ||
    q.includes("html") ||
    q.includes("javascript")
  ){

    return `
I can help with coding once the real AI backend is connected.

The important part is already prepared: Nebula's frontend has a dedicated place for the backend connection.
`;

  }


  if(
    q.includes("math") ||
    q.includes("calculate")
  ){

    return `
I can handle calculations through the real AI backend.

The current demo mode is intentionally limited, but the chat interface itself is working.
`;

  }


  return `
Your message was received.

Nebula's interface is working correctly. The next step is connecting the secure backend so responses come from a real AI model.
`;

}


if(
  localStorage.getItem(THEME)==="dark"
){

  document.body
    .classList
    .add("dark");

}


if(!chats.length){

  chats=[{
    id:current,
    title:"New chat",
    messages:[]
  }];

}


save();

renderMessages();

</script>

</body>
</html>
