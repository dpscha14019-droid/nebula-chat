<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nebula — AI Chat</title>
<meta name="description" content="A modern AI chatbot interface.">
<style>
:root{color-scheme:dark;--bg:#08090d;--panel:#101218;--panel2:#151821;--text:#f5f7fb;--muted:#949aaa;--line:#252936;--accent:#8b7cff;--accent2:#5eead4;--user:#202331;--shadow:0 24px 80px rgba(0,0,0,.35)}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,textarea{font:inherit}button{cursor:pointer}
.app{height:100dvh;display:grid;grid-template-columns:260px 1fr;background:radial-gradient(circle at 70% -10%,rgba(139,124,255,.16),transparent 35%),var(--bg)}
.sidebar{border-right:1px solid var(--line);background:rgba(10,11,16,.88);backdrop-filter:blur(20px);padding:16px;display:flex;flex-direction:column;gap:14px}.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:18px;padding:7px}.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 28px rgba(139,124,255,.3);display:grid;place-items:center;color:#08090d;font-weight:900}.new{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:11px 13px;text-align:left}.new:hover{border-color:#3b4050}.history{flex:1;overflow:auto}.history-title{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin:13px 8px}.chat-item{padding:9px 10px;border-radius:9px;color:#c8cbd5;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-item.active,.chat-item:hover{background:var(--panel2);color:#fff}.side-foot{font-size:11px;color:var(--muted);padding:7px}.main{min-width:0;display:grid;grid-template-rows:62px 1fr auto}.top{border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:rgba(8,9,13,.62);backdrop-filter:blur(18px)}.model{font-size:13px;color:#cfd2dc}.status{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}.dot{width:7px;height:7px;border-radius:50%;background:#5eead4;box-shadow:0 0 12px #5eead4}.messages{overflow:auto;padding:34px max(18px,calc((100vw - 900px)/2));scroll-behavior:smooth}.welcome{max-width:720px;margin:11vh auto 0;text-align:center}.welcome h1{font-size:clamp(32px,5vw,52px);letter-spacing:-.045em;margin:0 0 12px;background:linear-gradient(90deg,#fff,#aaa8ff,#8eeadd);-webkit-background-clip:text;background-clip:text;color:transparent}.welcome p{color:var(--muted);margin:0 auto 24px}.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.chip{background:var(--panel);border:1px solid var(--line);color:#cfd2dc;padding:9px 12px;border-radius:999px;font-size:12px}.msg{display:flex;gap:12px;margin:22px 0;animation:up .22s ease}.msg.user{justify-content:flex-end}.bubble{max-width:min(760px,85%);padding:13px 15px;border-radius:16px;line-height:1.6;font-size:14px;white-space:pre-wrap}.assistant .bubble{background:transparent;border:1px solid var(--line)}.user .bubble{background:var(--user);border:1px solid #2c3040}.avatar{width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--panel2);border:1px solid var(--line)}.user .avatar{order:2}.composer{padding:14px max(18px,calc((100vw - 900px)/2));border-top:1px solid var(--line);background:linear-gradient(transparent,rgba(8,9,13,.95) 18%)}.box{display:flex;align-items:end;gap:8px;background:var(--panel);border:1px solid #2b2f3a;border-radius:18px;padding:9px;box-shadow:var(--shadow)}textarea{resize:none;outline:0;border:0;background:transparent;color:var(--text);width:100%;min-height:42px;max-height:180px;padding:10px;font-size:14px;line-height:1.5}textarea::placeholder{color:#707584}.send{width:42px;height:42px;border:0;border-radius:12px;background:#fff;color:#0b0c10;font-weight:900}.send:disabled{opacity:.35}.hint{text-align:center;color:#626775;font-size:10px;margin-top:8px}@keyframes up{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{display:none}.top{padding:0 15px}.messages{padding:25px 14px}.composer{padding:10px 12px}.welcome{margin-top:14vh}.bubble{max-width:90%}}
</style></head>
<body><div class="app">
<aside class="sidebar"><div class="brand"><div class="logo">N</div>Nebula</div><button class="new" id="newChat">＋ New chat</button><div class="history"><div class="history-title">Recent</div><div class="chat-item active">New conversation</div></div><div class="side-foot">Private interface · AI powered</div></aside>
<main class="main"><header class="top"><div class="model">Nebula AI <span style="color:#626775">·</span> Smart Chat</div><div class="status"><span class="dot"></span> Ready</div></header>
<section class="messages" id="messages"><div class="welcome" id="welcome"><h1>Ask anything.</h1><p>A clean, fast AI workspace for questions, ideas, coding and learning.</p><div class="chips"><button class="chip">Explain a difficult topic</button><button class="chip">Help me write</button><button class="chip">Solve a problem</button></div></div></section>
<form class="composer" id="form"><div class="box"><textarea id="input" rows="1" placeholder="Message Nebula…" autocomplete="off"></textarea><button class="send" id="send" aria-label="Send">↑</button></div><div class="hint">Enter to send · Shift + Enter for a new line</div></form></main></div>
<script>
const API_URL='YOUR_WORKER_URL';
const messages=document.querySelector('#messages'),welcome=document.querySelector('#welcome'),input=document.querySelector('#input'),form=document.querySelector('#form'),send=document.querySelector('#send'),newChat=document.querySelector('#newChat');
let history=[];
function add(role,text){if(welcome)welcome.remove();const row=document.createElement('div');row.className='msg '+role;const av=document.createElement('div');av.className='avatar';av.textContent=role==='user'?'Y':'N';const b=document.createElement('div');b.className='bubble';b.textContent=text;row.append(role==='user'?b:av,role==='user'?av:b);messages.append(row);messages.scrollTop=messages.scrollHeight;return b}
async function ask(text){add('user',text);history.push({role:'user',content:text});const bubble=add('assistant','Thinking…');send.disabled=true;try{if(API_URL==='YOUR_WORKER_URL')throw new Error('Set API_URL to your deployed Worker URL.');const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});if(!r.ok)throw new Error('Server error '+r.status);const data=await r.json();const answer=data.answer||'No answer returned.';bubble.textContent=answer;history.push({role:'assistant',content:answer})}catch(e){bubble.textContent='Connection not configured yet. Deploy the Worker and replace YOUR_WORKER_URL in index.html.\n\n'+e.message}finally{send.disabled=false;input.focus()}}
form.addEventListener('submit',e=>{e.preventDefault();const t=input.value.trim();if(!t||send.disabled)return;input.value='';input.style.height='auto';ask(t)});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,180)+'px'});document.querySelectorAll('.chip').forEach(x=>x.onclick=()=>{input.value=x.textContent;form.requestSubmit()});newChat.onclick=()=>{location.reload()};
</script></body></html>
